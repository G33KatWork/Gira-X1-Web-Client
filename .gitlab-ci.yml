stages:
  - build

build-container:
  stage: build
  image: docker:29-cli
  services:
    - name: docker:29-dind
      alias: docker
  variables:
    # The runner must share /certs/client with the privileged Docker service.
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_CERT_PATH: /certs/client
    DOCKER_TLS_VERIFY: "1"
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'
  before_script:
    - apk add --no-cache python3 innoextract
    - docker info
    # Buildx needs a named context with TLS material, not only environment variables.
    - >-
      docker context create ci-docker
      --docker "host=$DOCKER_HOST,ca=$DOCKER_CERT_PATH/ca.pem,cert=$DOCKER_CERT_PATH/cert.pem,key=$DOCKER_CERT_PATH/key.pem"
    # Official BuildKit includes QEMU for the non-native nginx validation step.
    - docker buildx create ci-docker --name ci-builder --driver docker-container --use --bootstrap
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
  script:
    # A fresh checkout downloads the installer and applies the maintained patches.
    - python3 setup.py
    # Push both platforms together so every tag refers to the complete image index.
    - |
      set -- --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
      if [ "${CI_COMMIT_BRANCH:-}" = "$CI_DEFAULT_BRANCH" ]; then
        set -- "$@" --tag "$CI_REGISTRY_IMAGE:latest"
      fi
      docker buildx build --builder ci-builder --pull --platform linux/amd64,linux/arm64/v8 \
        "$@" --push .
