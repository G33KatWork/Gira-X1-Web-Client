server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Patched vendor assets keep their filenames between releases. Revalidate
    # them so an upgrade cannot mix an old bundle with new HTML or CSS.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
